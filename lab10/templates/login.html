{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
  <h2>Login</h2>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="POST" action="{{ url_for('login') }}">
    <p><label>Email:</label>
       <input type="email" name="email" value="{{ email }}" required></p>

    <p><label>Password:</label>
       <input type="password" name="password" required></p>

    <button type="submit">Log in</button>
  </form>

  <p>No account yet? <a href="{{ url_for('task4') }}">Register here</a>.</p>
{% endblock %}
