{% extends "base.html" %}
{% block title %}Task 2{% endblock %}

{% block content %}
  <h2>Task 2 - Email Validation</h2>

  <form method="POST" action="/task2">
    <label>Email:</label>
    <input type="text" name="email" value="{{ email }}">
    <br>
    <button type="submit">Submit</button>
  </form>

  {% if result %}
    <p class="{{ 'success' if success else 'error' }}">{{ result }}</p>
  {% endif %}
{% endblock %}
