{% extends "base.html" %}
{% block title %}Task 4{% endblock %}

{% block content %}
  <h2>Task 4 - Complete Student Registration</h2>

  <form method="POST" action="/task4">
    <p><label>Full Name:</label>
       <input type="text" name="name" value="{{ data.name }}"></p>

    <p><label>Email:</label>
       <input type="text" name="email" value="{{ data.email }}"></p>

    <p><label>Age:</label>
       <input type="text" name="age" value="{{ data.age }}"></p>

    <button type="submit">Register</button>
  </form>

  {% if errors %}
    <ul class="errors">
      {% for e in errors %}<li>{{ e }}</li>{% endfor %}
    </ul>
  {% endif %}

  {% if success %}
    <p class="success">Registration data is valid!</p>
  {% endif %}
{% endblock %}
