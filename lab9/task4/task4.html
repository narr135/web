<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <main class="flex-grow-1 d-flex flex-column align-items-center justify-content-center px-3 pb-5">
    <img src="../assets/google_logo.svg" alt="Google" class="google-logo mb-4">

    <form class="search-form" action="https://www.google.com/search" method="get" role="search">
      <div class="search-box mb-4">
        <span class="google-icon search-icon" aria-hidden="true">
          <img src="../assets/google_search.svg" alt="..." class="search-logo">
        </span>
        <input type="text" class="search-input" name="q" placeholder="Search Google" aria-label="Search" autocomplete="off">
        <span class="google-icon mic-icon" aria-hidden="true">
          <img src="../assets/google_mic.svg" alt="..." class="mic-logo">
        </span>
        <span class="google-icon lens-icon" aria-hidden="true">
          <img src="../assets/google_lens.svg" alt="..." class="lens-logo">
        </span>
      </div>

      <div class="google-buttons d-flex justify-content-center gap-2 flex-wrap">
        <button type="submit" class="btn">Google Search</button>
        <button type="submit" class="btn" name="btnI" value="1" formaction="https://www.google.com/search">
          I'm Feeling Lucky
        </button>
      </div>
    </form>

    <p class="language-line mt-4 mb-0">
      Google offered in:
      <a href="#">қазақ</a>
      <a href="#">русский</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
