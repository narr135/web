{% extends "base.html" %}

{% block title %}Delete {{ shelf.name }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card content-card p-4 p-md-5 text-center">
                    <div class="danger-icon"><i class="bi bi-trash3"></i></div>
                    <h1 class="h3">Delete “{{ shelf.name }}”?</h1>
                    <p class="text-body-secondary">
                        The shelf will be removed, but every book stays in the catalog and on your other shelves.
                    </p>
                    <form method="post" class="d-flex gap-2 justify-content-center mt-3">
                        {% csrf_token %}
                        <button class="btn btn-danger" type="submit">Delete shelf</button>
                        <a class="btn btn-outline-secondary" href="{% url 'library:shelf_detail' shelf.pk %}">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
